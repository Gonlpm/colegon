<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Alumno - Cole Gon</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Cole Gon</h1>
    <p>Portal del alumno</p>
  </header>

  <main>

    <h2 id="nombre-alumno">Cargando...</h2>

    <p>
      Número de alumno:
      <strong id="numero-alumno">...</strong>
    </p>

    <p>
      Curso:
      <strong id="curso-alumno">...</strong>
    </p>

    <p>
      Grupo:
      <strong id="grupo-alumno">...</strong>
    </p>

    <hr>

    <h2>Tareas</h2>
    <div id="tareas">
      <p>Cargando tareas...</p>
    </div>

    <hr>

    <h2>Avisos</h2>
    <div id="avisos">
      <p>Cargando avisos...</p>
    </div>

  </main>

  <script src="alumno.js"></script>

</body>
</html>
