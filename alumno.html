<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Alumno - Cole Gon</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Cole Gon</h1>
    <p>Portal del alumno</p>
  </header>

  <main>

    <button id="cerrar-sesion">
      Cerrar sesión
    </button>

    <section>

      <h2 id="nombre-alumno">
        Cargando...
      </h2>

      <p>
        <strong>Número de alumno:</strong>
        <span id="numero-alumno">...</span>
      </p>

      <p>
        <strong>Curso:</strong>
        <span id="curso-alumno">...</span>
      </p>

      <p>
        <strong>Grupo:</strong>
        <span id="grupo-alumno">...</span>
      </p>

    </section>

    <hr>

    <section>

      <h2>📚 Tareas pendientes</h2>

      <div id="tareas">
        <p>Cargando tareas...</p>
      </div>

    </section>

    <hr>

    <section>

      <h2>📢 Avisos</h2>

      <div id="avisos">
        <p>Cargando avisos...</p>
      </div>

    </section>

  </main>

  <script src="alumno.js"></script>

</body>
</html>
