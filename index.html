<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cole Gon</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="login-container">

    <section>

      <h1>Cole Gon</h1>

      <p>
        Portal del alumnado y profesorado
      </p>

      <hr>

      <h2>Iniciar sesión</h2>

      <form id="login-form">

        <input
          type="email"
          id="email"
          placeholder="Correo electrónico"
          autocomplete="email"
          required
        >

        <div style="position: relative; width: 100%;">

          <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
            style="width: 100%; padding-right: 45px; box-sizing: border-box;"
          >

          <button
            type="button"
            id="mostrar-password"
            aria-label="Mostrar contraseña"
            style="
              position: absolute;
              right: 8px;
              top: 50%;
              transform: translateY(-50%);
              border: none;
              background: transparent;
              padding: 5px;
              margin: 0;
              cursor: pointer;
              font-size: 18px;
              width: auto;
            "
          >
            👁️
          </button>

        </div>

        <button type="submit">
          Iniciar sesión
        </button>

        <button
          type="button"
          id="olvido-contrasena"
        >
          ¿Has olvidado tu contraseña?
        </button>

        <p id="mensaje"></p>

      </form>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

  <script>
    const botonMostrarPassword =
      document.getElementById("mostrar-password");

    const campoPassword =
      document.getElementById("password");

    botonMostrarPassword.addEventListener("click", () => {

      if (campoPassword.type === "password") {

        campoPassword.type = "text";
        botonMostrarPassword.textContent = "🙈";
        botonMostrarPassword.setAttribute(
          "aria-label",
          "Ocultar contraseña"
        );

      } else {

        campoPassword.type = "password";
        botonMostrarPassword.textContent = "👁️";
        botonMostrarPassword.setAttribute(
          "aria-label",
          "Mostrar contraseña"
        );

      }

    });
  </script>

</body>

</html>
