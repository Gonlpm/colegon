<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cole Gon</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="login-container">

    <h1>Cole Gon</h1>
    <p>Portal del alumnado y profesorado</p>

    <form id="login-form">

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        required
      >

      <button type="submit">Iniciar sesión</button>

      <p id="mensaje"></p>

    </form>

  </main>

  <script src="app.js"></script>

</body>
</html>
