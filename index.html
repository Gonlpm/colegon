<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cole Gon</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="login-container">

    <section>

      <h1>Cole Gon</h1>

      <p>
        Portal del alumnado y profesorado
      </p>

      <hr>

      <h2>Iniciar sesión</h2>

      <form id="login-form">

        <input
          type="email"
          id="email"
          placeholder="Correo electrónico"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        >

        <button type="submit">
          Iniciar sesión
        </button>

        <p id="mensaje"></p>

      </form>

    </section>

  </main>

  <script src="app.js"></script>

</body>

</html>
